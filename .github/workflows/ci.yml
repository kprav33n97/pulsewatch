name: CI

on:
  pull_request:
  push:
    branches: [main]

# a new push cancels the older run for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# least privilege: this workflow can only read the repo
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: for f in *.js; do node --check "$f"; done
      - name: Start API and hit /health
        env:
          DB_PATH: /tmp/ci.db
        run: |
          node index.js &
          sleep 3
          curl -f http://localhost:4000/health

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack and wait until healthy
        run: docker compose up -d --wait --wait-timeout 90
      - name: Smoke test through nginx
        run: |
          curl -f http://localhost:3000/
          curl -f http://localhost:3000/api/stats
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

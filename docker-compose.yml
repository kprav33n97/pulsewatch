services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-30}
    volumes:
      - pw-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pw-data:
